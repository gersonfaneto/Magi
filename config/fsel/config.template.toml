# config/fsel/config.template.toml
#
# Rendered by theme.py into ~/.config/fsel/config.toml, so the launcher wears
# the active palette. Field placement is strict: fsel refuses to start on an
# unknown key, and UI colours only belong at the root.
highlight_color = "{{ colors.primary.hex }}"
main_background_color = "{{ colors.background.hex }}"
items_background_color = "{{ colors.background.hex }}"
items_selection_background_color = "{{ colors.primary.hex }}"
items_text_color = "{{ colors.on_surface.hex }}"
main_text_color = "{{ colors.on_surface.hex }}"
input_text_color = "{{ colors.on_surface.hex }}"
input_background_color = "{{ colors.background.hex }}"
header_title_color = "{{ colors.on_surface_variant.hex }}"
main_border_color = "{{ colors.outline.hex }}"
items_border_color = "{{ colors.outline.hex }}"
input_border_color = "{{ colors.outline.hex }}"
cursor = "|"
selection_marker = ">"
show_input_prompt = true
show_input_count = false
show_panel_titles = false
input_panel_style = "command"
terminal_launcher = "foot -e"

[app_launcher]
ranking_mode = "frecency"
filter_desktop = false
list_executables_in_path = false

[dmenu]
delimiter = "\t"
show_line_numbers = false
