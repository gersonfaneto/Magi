# -*- conf -*-
# vim:ft=dosini:cms=#\ %s:
# Mono light theme -- a pure grayscale ramp with the ANSI brightness order
# inverted so "white" stays readable on a light background.

[main]
initial-color-theme=light

[colors-light]
foreground=111111
background=f7f7f7

regular0=f2f2f2
regular1=8a8a8a
regular2=6e6e6e
regular3=5c5c5c
regular4=4a4a4a
regular5=3a3a3a
regular6=2a2a2a
regular7=1a1a1a

bright0=d0d0d0
bright1=7a7a7a
bright2=606060
bright3=505050
bright4=404040
bright5=303030
bright6=202020
bright7=000000

selection-foreground=000000
selection-background=e5e5e5
urls=1a1a1a
cursor=f7f7f7 111111
