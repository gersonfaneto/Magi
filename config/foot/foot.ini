# config/foot/foot.ini

[main]
# Size fonts from the compositor's scale factor only, not each output's
# physical DPI. With dpi-aware=yes, moving a window from the ~157 DPI laptop
# panel to a 96 DPI HDMI output shrinks the glyphs while the window keeps its
# pixel geometry, which leaves tiny text in an unchanged window.
dpi-aware=no
pad=10x12

# The generated mono themes don't carry these, so keep foot's transparency
# and dim blending here. foot 1.28 has no plain [colors] section -- the palette
# lives in colors-dark/colors-light, so alpha has to be repeated for the light
# pick; dim-blend-towards=black is colors-dark's default, while colors-light
# wants foot's own (white), which is why it isn't listed there.
[colors-dark]
alpha=0.92
dim-blend-towards=black

[colors-light]
alpha=0.92

[scrollback]
lines=10000

[key-bindings]
