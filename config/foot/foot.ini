# config/foot/foot.ini

[main]
dpi-aware=yes
pad=10x12

[scrollback]
lines=10000

[key-bindings]
# Foot knows no Ctrl+Insert/Shift+Insert by default (clipboard-copy is
# Ctrl+Shift+c, clipboard-paste Ctrl+Shift+v), but the universal clipboard
# binds (SUPER+c/v) forward those legacy CUA combos, so they are added here
# beside the defaults rather than instead of them. Shift+Insert has to move
# off primary-paste first -- foot refuses a combo mapped to two actions --
# and middle-click keeps pasting the primary selection regardless, since that
# lives in [mouse-bindings].
primary-paste=none
clipboard-copy=Control+Shift+c XF86Copy Control+Insert
clipboard-paste=Control+Shift+v XF86Paste Shift+Insert
