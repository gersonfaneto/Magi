# ~/.config/hypr/hypridle.conf
#
# Initial copy, seeded by the quickshell module's hypridle.service when the file
# is missing. The Quickshell Idle/Lock surface (config/quickshell/pill/IdleLock.qml)
# owns this file afterwards and regenerates it from its own values.

general {
    lock_cmd = $HOME/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/lock.sh
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}
