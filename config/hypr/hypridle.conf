# ~/.config/hypr/hypridle.conf
#
# Initial copy, seeded by the hypridle.service in modules/wm/hyprland when the
# file is missing. Edit it in place afterwards; hypridle reads it on start and
# `magi reload @hypr` restarts the unit.

general {
    lock_cmd = $HOME/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/lock.sh
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}
