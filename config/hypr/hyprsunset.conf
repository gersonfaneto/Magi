# ~/.config/hypr/hyprsunset.conf
#
# Initial copy, seeded by the hyprsunset.service in modules/wm/hyprland when the
# file is missing. Edit it in place afterwards; hyprsunset reads it on start and
# `magi reload @hypr` restarts the unit.

max-gamma = 150

profile {
    time = 0:00
    identity = true
}
