# ~/.config/hypr/hyprsunset.conf
#
# Initial copy, seeded by the quickshell module's hyprsunset.service when the file
# is missing. The Quickshell Night Light surface (config/quickshell/pill/Singletons/
# NightLight.qml) owns this file afterwards and regenerates it from its own values.

max-gamma = 150

profile {
    time = 0:00
    identity = true
}
