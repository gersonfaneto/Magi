# vim:ft=tmux:ts=4:sts=4:sw=4:et:fdm=marker:fmr=<<<,>>>:

### Default behavior <<<
# Tell Tmux that outside terminal supports true color
set -gq default-terminal 'tmux-256color'
set -gqa terminal-overrides ',*:Tc'

# Stop tmux from launching login shells every time when a new pane is created
set-hook -g session-created {
    set -gq default-command "$SHELL"
}

set -gq display-time 1024
set -gq history-limit 65536
set -gq renumber-windows on
set-hook -g window-linked 'move-window -r'

# Prevent lagging Esc in vim
set -s escape-time 0

# Start windows and panes from 1
set -gq base-index 1
setw -g pane-base-index 1
# >>>

### Mouse settings <<<
set -gq mouse on

# Don't clear selection on mouse drag/click
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDown1Pane send -X clear-selection
bind -T copy-mode-vi DoubleClick1Pane send -X select-word
#>>>

### UI settings <<<

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme: .1's layout and format strings, Noctalia's @hey_* palette
# (rendered from colors.template.conf into ~/.config/tmux/themes/noctalia.conf)
if '[ -f ~/.config/tmux/themes/noctalia.conf ]' 'source-file ~/.config/tmux/themes/noctalia.conf'

set -gqF status-style "bg=#{@hey_surface_container_low},fg=#{@hey_on_surface}"
set -g status-left "#[fg=#{@hey_on_primary},bg=#{@hey_primary},bold] #S #[bg=default] "
set -g status-right "#[fg=#{@hey_primary}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@hey_on_surface_variant}]#h "
set -g window-status-format "#[fg=#{@hey_outline}] #I:#W "
set -g window-status-current-format "#[fg=#{@hey_primary},bold] #I:#W "
if-shell -F '#{==:#{@hey_inactive_tabs_use_background},off}' \
  'set -gqF window-status-style "fg=#{@hey_on_surface_variant}"' \
  'set -gqF window-status-style "bg=#{@hey_surface_container},fg=#{@hey_on_surface_variant}"'
set -gqF window-status-current-style "bg=#{@hey_surface_container_highest},fg=#{@hey_on_surface},bold"
set -gqF window-status-last-style "fg=#{@hey_on_surface},bold"
set -gqF window-status-activity-style "bg=#{@hey_tertiary_container},fg=#{@hey_on_tertiary_container}"
set -gqF window-status-bell-style "bg=#{@hey_error_container},fg=#{@hey_on_error_container},bold"
set -gqF pane-border-style "fg=#{@hey_outline_variant}"
set -gqF pane-active-border-style "fg=#{@hey_primary}"
set -gqF message-style "bg=#{@hey_primary_container},fg=#{@hey_on_primary_container}"
set -gqF message-command-style "bg=#{@hey_primary_container},fg=#{@hey_on_primary_container}"
set -gqF mode-style "bg=#{@hey_primary},fg=#{@hey_on_primary},bold"
set -gqF popup-style "bg=#{@hey_surface},fg=#{@hey_on_surface}"
set -gqF popup-border-style "fg=#{@hey_outline}"
set -gqF menu-style "bg=#{@hey_surface_container_high},fg=#{@hey_on_surface}"
set -gqF menu-selected-style "bg=#{@hey_primary},fg=#{@hey_on_primary},bold"
set -gqF menu-border-style "fg=#{@hey_outline}"
set -gqF copy-mode-match-style "bg=#{@hey_tertiary_container},fg=#{@hey_on_tertiary_container}"
set -gqF copy-mode-current-match-style "bg=#{@hey_primary_container},fg=#{@hey_on_primary_container},bold"
set -gqF copy-mode-selection-style "bg=#{@hey_secondary_container},fg=#{@hey_on_secondary_container}"
setw -gqF clock-mode-colour "#{@hey_primary}"
