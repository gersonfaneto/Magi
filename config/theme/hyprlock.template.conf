# hyprlock.template.conf -- rendered to ~/.config/hypr/hyprlock.conf
#
# The session lock. It grabs the current frame as a blurred backdrop and asks
# for the password; hypridle and SUPER+CTRL+L both go through scripts/lock.sh.
#
# Sizes are in pixels. Colours come from the active mono bundle, through the
# same theme manifest as every other palette consumer.

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    vibrancy = 0.2
    color = rgba({{colors.surface.default.hex_stripped}}cc)
}

label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $DATE
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgba({{colors.on_surface.default.hex_stripped}}b3)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba({{colors.outline_variant.default.hex_stripped}}ff)
    inner_color = rgba({{colors.surface_container_high.default.hex_stripped}}ff)
    font_color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    fade_on_empty = false
    rounding = 8
    check_color = rgba({{colors.primary.default.hex_stripped}}ff)
    fail_color = rgba({{colors.error.default.hex_stripped}}ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = <span foreground="#{{colors.faint.default.hex_stripped}}">Password...</span>
    position = 0, -40
    halign = center
    valign = center
}
