# Auto-generated by the theme pipeline (config/hypr/scripts/theme.py).
# Edit config/theme/tmux.template.conf, not this file.
#
# Sourced after the live config, so these override its ANSI colour names.
set -g status-style "bg={{colors.surface_container.hex}},fg={{colors.on_surface.hex}}"
set -g status-left-style "bg={{colors.surface_container.hex}},fg={{colors.on_surface.hex}}"
set -g status-right-style "bg={{colors.surface_container.hex}},fg={{colors.on_surface.hex}}"
set -g pane-border-style "fg={{colors.outline_variant.hex}}"
set -g pane-active-border-style "fg={{colors.primary.hex}}"
set -g message-style "bg={{colors.primary_container.hex}},fg={{colors.on_primary_container.hex}}"
set -g message-command-style "bg={{colors.surface_container.hex}},fg={{colors.on_surface.hex}}"
setw -g mode-style "bg={{colors.primary.hex}},fg={{colors.on_primary.hex}}"
set -g clock-mode-colour "{{colors.primary.hex}}"
set -g window-status-style "bg={{colors.surface_container.hex}},fg={{colors.on_surface_variant.hex}}"
set -g window-status-current-style "bg={{colors.primary.hex}},fg={{colors.on_primary.hex}}"
set -g window-status-activity-style "bg={{colors.surface_container.hex}},fg={{colors.tertiary.hex}}"
set -g window-status-bell-style "bg={{colors.error.hex}},fg={{colors.on_error.hex}}"
set -g pane-border-format " #[fg={{colors.on_surface_variant.hex}}]#{pane_index} #{pane_title} "
